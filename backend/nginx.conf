events { 
    worker_connections 1024; 
}

http {
    server {
        listen 80;

        # Redireciona chamadas de autenticação para o iam-service
        location /auth/ {
            proxy_pass http://iam-service:3001/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redireciona a documentação Swagger do IAM
        location /api-docs/ {
            proxy_pass http://iam-service:3001/api-docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}