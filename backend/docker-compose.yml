version: '3.8'

services:
  # ==================== API GATEWAY ====================
  gateway:
    image: nginx:alpine
    container_name: api_gateway
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - iam-service

  # ==================== BANCOS DE DADOS ====================
  postgres:
    image: postgres:16-alpine
    container_name: postgres_wms
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-lista_inteligente_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lista_inteligente_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_wms
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # ==================== MICROSSERVIÇOS ====================
  iam-service:
    build: ./iam-service
    container_name: iam_service
    restart: unless-stopped
    # Sem a seção 'ports' para bloquear acesso direto vindo de fora do Docker
    env_file:
      - .env
    environment:
      - AUTH_SERVICE_PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lista_inteligente_db?schema=public
      - JWT_SECRET=sua_chave_secreta_super_segura
      - FORCE_COLOR=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data: