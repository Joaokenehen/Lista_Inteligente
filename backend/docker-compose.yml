services:
  # ==================== API GATEWAY ====================
  gateway:
    image: nginx:alpine
    container_name: api_gateway
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - iam-service

  # ==================== BANCOS DE DADOS ====================
  mysql:
    image: mysql:8.0
    container_name: mysql_lista
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_admin} # Obrigatório no container MySQL
      MYSQL_USER: ${DB_USER:-mysqluser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mysqlpass}
      MYSQL_DATABASE: ${DB_NAME:-lista_inteligente_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_wms
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # ==================== MICROSSERVIÇOS ====================
  iam-service:
    build: ./iam-service
    container_name: iam_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - AUTH_SERVICE_PORT=3001
      - DATABASE_URL=mysql://${DB_USER:-mysqluser}:${DB_PASSWORD:-mysqlpass}@mysql:3306/${DB_NAME:-lista_inteligente_db}
      - JWT_SECRET=sua_chave_secreta_super_segura
      - FORCE_COLOR=1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql_data: