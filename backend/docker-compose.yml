services:
  # ==================== API GATEWAY ====================
  gateway:
    image: nginx:alpine
    container_name: api_gateway
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - iam-service
      - lists-service

  # ==================== BANCOS DE DADOS ====================
  mysql:
    image: mysql:8.0
    container_name: mysql_lista
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_admin}
      MYSQL_USER: ${DB_USER:-mysqluser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mysqlpass}
      MYSQL_DATABASE: ${DB_NAME:-lista_inteligente_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis_wms
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # ==================== MICROSSERVIÇOS ====================
  iam-service:
    build: ./iam-service
    container_name: cartflow-iam_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - AUTH_SERVICE_PORT=3001
      - DATABASE_URL=mysql://${DB_USER:-mysqluser}:${DB_PASSWORD:-mysqlpass}@mysql:3306/${DB_NAME:-lista_inteligente_db}
      - JWT_SECRET=${JWT_SECRET:-sua_chave_secreta_super_segura}
      - FORCE_COLOR=1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  lists-service:
    build: ./lists-service
    container_name: cartflow-lists-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=cartflow_lists
      - DB_USER=root
      - DB_PASS=${DB_ROOT_PASSWORD:-root_admin}
      - JWT_SECRET=${JWT_SECRET:-sua_chave_secreta_super_segura}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: